<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1029"><meta name="description" content="Uma jornada de seis capítulos para devolver as estrelas ao céu.">
<title>Lunara · As Estrelas Perdidas</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="game-container">
<canvas id="gameCanvas" aria-label="Cenário de Lunara. Use os controles descritos em Como jogar."></canvas>
<div id="hud" class="hidden">
 <div class="hud-stars"><span class="hud-pill" aria-label="Fragmentos desta fase"><span class="gold" aria-hidden="true">★</span><span id="star-count-text">0 / 5</span></span><span class="hud-pill" aria-label="Memória desta fase"><span class="violet" aria-hidden="true">◆</span><span id="secret-count-text">0 / 1</span></span></div>
 <div class="hud-controls"><button id="power-status" class="hud-btn" aria-label="Ativar poder estelar" disabled>✦<span id="power-dots" aria-hidden="true"></span></button><button id="btn-sound-toggle" class="hud-btn" aria-label="Silenciar áudio" aria-pressed="false">♫</button><button id="btn-settings-toggle" class="hud-btn" aria-label="Pausar jogo">⏸</button></div>
</div>
<div id="touch-controls" class="hidden">
 <div class="touch-group"><button id="btn-touch-left" aria-label="Mover para esquerda">◀</button><button id="btn-touch-right" aria-label="Mover para direita">▶</button></div>
 <button id="btn-touch-jump" aria-label="Pular">↑</button>
</div>
<section id="title-screen" class="screen-overlay active" aria-labelledby="menu-title">
 <div class="title-content"><p class="eyebrow">UMA JORNADA PARA REACENDER O CÉU</p><div class="title-emblem" aria-hidden="true">✦</div><h1 id="menu-title" class="game-title">Lunara</h1><h2 class="game-subtitle">As Estrelas Perdidas</h2><p class="tagline">Uma pequena guardiã.<br>Seis caminhos. Um céu para reconstruir.</p>
 <div class="title-actions"><button id="btn-continue" class="btn-primary hidden">Continuar jornada</button><button id="btn-play" class="btn-primary">Começar jornada</button><button id="btn-map" class="btn-secondary">Capítulos</button><div class="menu-links"><button id="btn-open-story" class="btn-tertiary">Como jogar</button><button id="btn-open-settings" class="btn-tertiary">Configurações</button></div></div>
 <p id="menu-progress" class="small-note">Uma aventura sem pressa. Nenhuma vida para perder.</p></div>
</section>
<section id="dialog-screen" class="screen-overlay hidden" aria-labelledby="dialog-title">
 <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><p id="dialog-eyebrow" class="eyebrow"></p><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions" class="title-actions"></div></div>
</section>
<section id="settings-modal" class="screen-overlay hidden" aria-labelledby="settings-title">
 <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title"><p class="eyebrow">NO SEU RITMO</p><h2 id="settings-title">Configurações</h2><div class="settings-grid">
 <div class="setting-row"><label for="slider-music">Música</label><input id="slider-music" type="range" min="0" max="100" value="70"><output id="label-music" for="slider-music">70%</output></div>
 <div class="setting-row"><label for="slider-sfx">Efeitos sonoros</label><input id="slider-sfx" type="range" min="0" max="100" value="85"><output id="label-sfx" for="slider-sfx">85%</output></div>
 <div class="setting-row"><label for="toggle-screen-shake">Tremor de tela</label><input id="toggle-screen-shake" type="checkbox" checked></div>
 <div class="setting-row"><label for="toggle-reduce-motion">Reduzir movimento</label><input id="toggle-reduce-motion" type="checkbox"></div>
 <div class="setting-row"><label for="select-particles">Partículas</label><select id="select-particles"><option value="low">Poucas</option><option value="medium">Médias</option><option value="high">Muitas</option></select></div>
 <div class="setting-row"><label for="toggle-high-contrast">Destacar fragmentos</label><input id="toggle-high-contrast" type="checkbox"></div>
 <div class="setting-row"><label for="toggle-touch">Mostrar controles na tela</label><input id="toggle-touch" type="checkbox"></div>
 </div><button id="btn-close-settings" class="btn-primary">Salvar e voltar</button></div>
</section>
<div id="fade-curtain" aria-hidden="true"></div>
</main>
<script src="js/config.js"></script><script src="js/audio.js"></script><script src="js/camera.js"></script><script src="js/particles.js"></script><script src="js/collectibles.js"></script><script src="js/checkpoint.js"></script><script src="js/player.js"></script><script src="js/level.js"></script><script src="js/campaign.js"></script><script src="js/world.js"></script><script src="js/ui.js"></script><script src="js/game.js"></script>
</body></html>
